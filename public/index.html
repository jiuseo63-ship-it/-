<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <!-- 로그인 / 회원가입 -->
        <div id="auth">

            <h1>My Website</h1>

            <p class="sub">
                로그인해서 사이트를 이용해보세요.
            </p>

            <div class="tabs">
                <button
                    class="tab active"
                    data-mode="login">
                    로그인
                </button>

                <button
                    class="tab"
                    data-mode="register">
                    회원가입
                </button>
            </div>

            <form id="form">

                <input
                    id="username"
                    type="text"
                    placeholder="아이디"
                    autocomplete="username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="비밀번호 (6자 이상)"
                    autocomplete="current-password"
                    required
                >

                <button
                    class="primary"
                    id="submit"
                    type="submit">
                    로그인
                </button>

            </form>

            <p id="message"></p>

        </div>


        <!-- 로그인 성공 화면 -->
        <div id="welcome" hidden>

            <div class="avatar">
                ✓
            </div>

            <h1>로그인 성공!</h1>

            <p>
                <b id="name"></b>님, 환영합니다!
            </p>

            <button
                class="primary"
                id="logout">
                로그아웃
            </button>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
